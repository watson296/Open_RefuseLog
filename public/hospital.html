<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>병원 · RefuseLog</title><link rel="stylesheet" href="/styles.css"/></head>
<body data-role="hospital"><div class="shell warm-shell">
  <header class="topbar"><div><div class="eyebrow">RefuseLog · Hospital</div><h1 id="pageTitle">병원</h1></div>
    <nav class="tabs"><a href="/emt" class="tab" data-role-link="emt">구급대원</a><a href="/hq" class="tab" data-role-link="hq">소방본부</a><a href="/hospital" class="tab" data-role-link="hospital">병원</a></nav></header>
  <section class="toolbar compact">
    <input id="stage1Input" type="hidden"/><input id="stage2Input" type="hidden"/>
    <button id="loadHospitalsBtn" class="btn primary" style="display:none">새로고침</button>
    <button id="resetRegionBtn" class="btn" style="display:none">기본</button>
    <button id="currentLocationBtn" class="btn" style="display:none">위치</button>
  </section>
  <section class="role-layout hospital-layout">
    <aside class="left-col">
      <div class="card" id="rolePanel"></div>
      <div class="card"><h3>내 병원 현황</h3><div id="hospitalDetailPanel" class="small-muted">로딩중...</div></div>
      <div class="card"><h3>처리 로그</h3><div id="logList"></div></div>
    </aside>
    <main class="right-col">
      <div class="card"><div class="card-head"><h3>병원 위치 / 구급차 접근</h3><span id="sourceBadge" class="pill success">-</span></div><div id="map" class="map"></div></div>
      <div class="card"><div class="card-head"><h3>수신 요청</h3><span id="listSummary" class="small-muted"></span></div><div id="hospitalList"></div></div>
    </main>
  </section>
</div>
<div id="requestQueue" style="display:none"></div><div id="regionLabel" style="display:none"></div>
<div class="modal hidden" id="refusalModal"><div class="modal-card">
  <h3>수용 거부 사유</h3><select id="refusalCategory"></select><select id="refusalSubcategory"></select>
  <textarea id="refusalNote" placeholder="추가 메모"></textarea>
  <div id="refusalWarning" class="warning">D-1은 법적 거부 사유 인정 여부 확인 필요</div>
  <div class="actions" style="justify-content:flex-end"><button id="closeRefusalBtn" class="btn">취소</button><button id="saveRefusalBtn" class="btn danger">저장</button></div>
</div></div>
<script src="/app.js"></script></body></html>
